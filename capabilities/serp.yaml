naftiko: 1.0.0-alpha2
info:
  label: Bright Data SERP
  description: |
    Real-time SERP data from Google, Bing, Yandex, and DuckDuckGo across 31 languages and 195
    countries. Asynchronous via /serp/req + /serp/get_result.
  tags:
  - Bright Data
  - SERP
  - Search
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    BRIGHTDATA_API_TOKEN: BRIGHTDATA_API_TOKEN
capability:
  consumes:
  - type: http
    namespace: serp
    baseUri: https://api.brightdata.com
    description: Bright Data SERP API business capability.
    resources:
    - name: serp-req
      path: /serp/req
      operations:
      - name: submitSerp
        method: POST
        description: Submit a SERP request.
        outputRawFormat: json
        outputParameters:
        - name: response_id
          type: string
          value: $.response_id
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: serp-get-result
      path: /serp/get_result
      operations:
      - name: getSerpResult
        method: GET
        description: Get the result of an async SERP request.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: response_id
          in: query
          type: string
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: 'Bearer {{env.BRIGHTDATA_API_TOKEN}}'
      placement: header
  exposes:
  - type: mcp
    namespace: serp-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bright Data SERP.
    tools:
    - name: bright-data-serp-submit
      description: Submit a SERP query for asynchronous processing.
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: serp.submitSerp
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: bright-data-serp-get-result
      description: Fetch a completed SERP result by response_id.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: serp.getSerpResult
      with:
        response_id: tools.response_id
      outputParameters:
      - type: object
        mapping: $.
