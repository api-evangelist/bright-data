naftiko: 1.0.0-alpha2
info:
  label: Bright Data Proxy Manager
  description: |
    Local REST control plane for the Bright Data Proxy Manager (port 22999). Create and configure
    proxy ports, ban IPs, refresh pools, and read zone configuration.
  tags:
  - Bright Data
  - Proxy Manager
  - Local API
  created: '2026-05-25'
  modified: '2026-05-25'
capability:
  consumes:
  - type: http
    namespace: proxy-manager
    baseUri: http://localhost:22999
    description: Bright Data Proxy Manager local API.
    resources:
    - name: proxies
      path: /api/proxies
      operations:
      - name: listProxies
        method: GET
        description: List configured proxy ports.
        outputRawFormat: json
        outputParameters:
        - name: ports
          type: array
          value: $.
        inputParameters: []
      - name: createProxy
        method: POST
        description: Create a new proxy port.
        outputRawFormat: json
        outputParameters:
        - name: port
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: refresh-ips
      path: /api/refresh_ips
      operations:
      - name: refreshIps
        method: POST
        description: Refresh the IP pool.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: false
    - name: zones
      path: /api/zones
      operations:
      - name: listZones
        method: GET
        description: List zones available in the local Proxy Manager.
        outputRawFormat: json
        outputParameters:
        - name: zones
          type: array
          value: $.
        inputParameters: []
    authentication:
      type: none
  exposes:
  - type: mcp
    namespace: proxy-manager-mcp
    port: 9090
    transport: http
    description: MCP adapter for the Bright Data Proxy Manager.
    tools:
    - name: bright-data-proxy-list
      description: List configured proxy ports.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: proxy-manager.listProxies
      with: {}
      outputParameters:
      - type: array
        mapping: $.
    - name: bright-data-proxy-create
      description: Create a new proxy port.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: proxy-manager.createProxy
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: bright-data-proxy-refresh-ips
      description: Refresh the IP pool.
      hints:
        readOnly: false
        destructive: true
        idempotent: false
      call: proxy-manager.refreshIps
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
