naftiko: 1.0.0-alpha2
info:
  label: Bright Data Scraping Shield
  description: |
    Domain classification API exposing Bright Data's compliance taxonomy.
  tags:
  - Bright Data
  - Scraping Shield
  - Compliance
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    BRIGHTDATA_API_TOKEN: BRIGHTDATA_API_TOKEN
capability:
  consumes:
  - type: http
    namespace: scraping-shield
    baseUri: https://api.brightdata.com
    description: Bright Data Scraping Shield API.
    resources:
    - name: classes
      path: /shield/class
      operations:
      - name: listClasses
        method: GET
        description: List available classifications.
        outputRawFormat: json
        outputParameters:
        - name: classes
          type: array
          value: $.
        inputParameters: []
    - name: domains-by-class
      path: /shield/domains_by_class
      operations:
      - name: getDomains
        method: GET
        description: List domains for a classification.
        outputRawFormat: json
        outputParameters:
        - name: domains
          type: array
          value: $.
        inputParameters:
        - name: class
          in: query
          type: string
          required: true
    - name: zones-by-class
      path: /shield/zones_by_class
      operations:
      - name: getZones
        method: GET
        description: List zones cleared for a classification.
        outputRawFormat: json
        outputParameters:
        - name: zones
          type: array
          value: $.
        inputParameters:
        - name: class
          in: query
          type: string
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: 'Bearer {{env.BRIGHTDATA_API_TOKEN}}'
      placement: header
  exposes:
  - type: mcp
    namespace: scraping-shield-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bright Data Scraping Shield.
    tools:
    - name: bright-data-shield-list-classes
      description: List Shield classifications.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: scraping-shield.listClasses
      with: {}
      outputParameters:
      - type: array
        mapping: $.
    - name: bright-data-shield-domains
      description: List domains by classification.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: scraping-shield.getDomains
      with:
        class: tools.class
      outputParameters:
      - type: array
        mapping: $.
