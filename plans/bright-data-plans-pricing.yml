description: |
  Machine-readable plans and pricing for Bright Data's published self-serve subscription tiers across
  Web Unlocker, SERP API, Web Scraper API, Residential Proxies, ISP Proxies, and Datacenter Proxies.
  Bright Data also offers a custom-priced Enterprise tier with dedicated account manager, premium SLA,
  SSO, and priority support across all products.
plans:
  - id: bright-data-web-unlocker-payg
    name: Web Unlocker — Pay As You Go
    type: payg
    description: No monthly commitment. Pay per 1,000 successful Web Unlocker results.
    entries:
      - label: Results
        name: results
        type: usage
        metric: results
        unit: 1000
        price: '1.50'
        timeFrame: usage
        geo: global
        domains: []
        userMultiplied: false
        description: Per 1,000 successful unlock responses.
    elements:
      - name: Pay only for successful requests
      - name: Unlimited concurrent requests
      - name: Worldwide geo-targeting
