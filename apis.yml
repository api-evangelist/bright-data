position: Consuming
description: >-
  Bright Data is an Israeli web data platform and operator of the world's largest legitimate residential proxy network
  (400M+ IPs across 195 countries). The platform combines proxy infrastructure (residential, ISP, datacenter, mobile)
  with higher-level web-access APIs — Web Unlocker, SERP API, Web Scraper API, Scraping Browser, Deep Lookup, and Web
  Archive — plus a 350-dataset marketplace and an MCP server that exposes 60+ web-access tools to AI agents. Serves
  20,000+ customers across eCommerce, finance, real estate, ad-tech, and AI/ML, and is a primary supplier of training
  and grounding data for foundation-model providers.
