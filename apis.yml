apis:
  - aid: bright-data:web-unlocker-api
    name: Bright Data Web Unlocker API
    tags:
      - Web Unlocker
      - Unblocking
      - Anti-Bot
      - CAPTCHA
    humanURL: https://docs.brightdata.com/scraping-automation/web-unlocker/introduction
    properties:
      - url: https://docs.brightdata.com/scraping-automation/web-unlocker/introduction
        type: Documentation
      - url: https://docs.brightdata.com/scraping-automation/web-unlocker/async-requests
        type: Documentation
      - url: openapi/bright-data-web-unlocker-api-openapi.yml
        type: OpenAPI
    description: >-
      Single-endpoint web unblocking with a 98%+ success rate. Send any URL, Bright Data handles residential proxy
      selection, JavaScript rendering, CAPTCHA solving, fingerprint spoofing, and anti-bot evasion, returning the fully
      rendered page. Supports both synchronous and asynchronous modes via `/unblocker/req` with `/unblocker/get_result`
      for polling. Pay only for successful requests.
  - aid: bright-data:serp-api
    name: Bright Data SERP API
    tags:
      - SERP
      - Search
      - Google
      - Bing
    humanURL: https://docs.brightdata.com/scraping-automation/serp-api/introduction
    properties:
      - url: https://docs.brightdata.com/scraping-automation/serp-api/introduction
        type: Documentation
      - url: https://docs.brightdata.com/scraping-automation/serp-api/send-your-first-request
        type: Documentation
      - url: openapi/bright-data-serp-api-openapi.yml
        type: OpenAPI
    description: >-
      Real-time SERP data from Google, Bing, Yandex, and DuckDuckGo across 31 languages and 195 countries. Supports
      organic, news, images, videos, shopping, jobs, hotels, flights, lens, trends, reviews, maps, and AI Overview
      result types. Submit asynchronous requests via `/serp/req` and poll `/serp/get_result`, or stream synchronously
      over the proxy on port 33335. Geolocation, device, browser, pagination, and localization parameters supported.
  - aid: bright-data:web-scraper-api
    name: Bright Data Web Scraper API
    tags:
      - Web Scraping
      - Datasets
      - Structured Data
    humanURL: https://docs.brightdata.com/scraping-automation/web-scraper-api/overview
    properties:
      - url: https://docs.brightdata.com/scraping-automation/web-scraper-api/overview
        type: Documentation
      - url: https://docs.brightdata.com/scraping-automation/web-scraper-api/trigger-a-collection
        type: Documentation
      - url: openapi/bright-data-web-scraper-api-openapi.yml
        type: OpenAPI
      - url: json-schema/bright-data-snapshot-schema.json
        type: JSONSchema
    description: >-
      Asynchronous snapshot-based scraping over 660+ pre-built dataset endpoints (Amazon, Walmart, LinkedIn, Instagram,
      TikTok, YouTube, Reddit, Google Maps, Airbnb, Booking, Zillow, and many more) plus custom collectors. Trigger via
      `POST /datasets/v3/scrape`, poll `/datasets/v3/progress/{snapshot_id}`, and download via
      `/datasets/v3/snapshot/{snapshot_id}`. Returns JSON, NDJSON, CSV, or Parquet; supports direct delivery to S3,
      Azure Blob, GCS, Snowflake, and webhooks.
  - aid: bright-data:scraping-browser-api
    name: Bright Data Scraping Browser API
    tags:
      - Browser Automation
      - Headless Browser
      - Puppeteer
      - Playwright
      - Selenium
    humanURL: https://docs.brightdata.com/scraping-automation/scraping-browser/introduction
    properties:
      - url: https://docs.brightdata.com/scraping-automation/scraping-browser/introduction
        type: Documentation
      - url: https://docs.brightdata.com/scraping-automation/scraping-browser/quickstart
        type: Documentation
      - url: openapi/bright-data-scraping-browser-api-openapi.yml
        type: OpenAPI
    description: >-
      Fully managed remote Chromium browsers driven over CDP/WebSocket from Puppeteer, Playwright, or Selenium. Each
      session ships with built-in unlocker logic, residential proxy egress, CAPTCHA solving, and fingerprint management
      so JavaScript-heavy and interactive flows complete reliably. REST endpoints expose session inventory (`GET
      /browser_sessions`) for observability and lifecycle inspection.
  - aid: bright-data:deep-lookup-api
    name: Bright Data Deep Lookup API
    tags:
      - Entity Resolution
      - People Search
      - Company Search
      - Enrichment
    humanURL: https://docs.brightdata.com/api-reference/deep-lookup/Deep-Lookup-API-Overview
    properties:
      - url: https://docs.brightdata.com/api-reference/deep-lookup/Deep-Lookup-API-Overview
        type: Documentation
      - url: openapi/bright-data-deep-lookup-api-openapi.yml
        type: OpenAPI
    description: >-
      Find companies and professionals across 1,000+ public sources with 95%+ accuracy. Submit a natural-language
      description or structured query via `POST /trigger`, preview row counts with `/preview`, optimize the query with
      `/enhance_query`, and enrich existing columns with `/request/{id}/enrich`. Results are downloaded via
      `/request/{id}/download`. Billed per result.
  - aid: bright-data:web-archive-api
    name: Bright Data Web Archive API
    tags:
      - Historical Data
      - Web Archive
      - Time Series
    humanURL: https://docs.brightdata.com/api-reference/web-archive-api/Web-Archive-API-Overview
    properties:
      - url: https://docs.brightdata.com/api-reference/web-archive-api/Web-Archive-API-Overview
        type: Documentation
      - url: openapi/bright-data-web-archive-api-openapi.yml
        type: OpenAPI
    description: >-
      Search and deliver petabyte-scale historical web snapshots across 250+ domains. Submit a query via `POST
      /webarchive/search`, monitor with `GET /webarchive/search/{search_id}`, list all searches via `GET
      /webarchive/searches`, and deliver matching corpora to S3/Azure/GCS via `POST /deliver-to-cloud`.
  - aid: bright-data:dataset-marketplace-api
    name: Bright Data Dataset Marketplace API
    tags:
      - Datasets
      - Marketplace
      - Bulk Data
    humanURL: https://docs.brightdata.com/datasets/marketplace
    properties:
      - url: https://docs.brightdata.com/datasets/marketplace
        type: Documentation
      - url: openapi/bright-data-dataset-marketplace-api-openapi.yml
        type: OpenAPI
    description: >-
      Programmatic access to 350+ ready-to-use datasets across 250+ domains (eCommerce, social, real estate, travel,
      business). List available datasets via `GET /datasets`, inspect schemas via `GET /datasets/{dataset_id}/metadata`,
      retrieve snapshots via `GET /datasets/snapshots/{id}`, and push deliveries to S3, Azure, GCS, Snowflake, or
      webhooks via `POST /datasets/snapshots/{id}/deliver`.
  - aid: bright-data:account-management-api
    name: Bright Data Account Management API
    tags:
      - Administrative
      - Zones
      - Billing
    humanURL: https://docs.brightdata.com/api-reference/account-management-api/Account-Management-API-Overview
    properties:
      - url: https://docs.brightdata.com/api-reference/account-management-api/Account-Management-API-Overview
        type: Documentation
      - url: openapi/bright-data-account-management-api-openapi.yml
        type: OpenAPI
      - url: json-schema/bright-data-zone-schema.json
        type: JSONSchema
    description: >-
      Manage Bright Data zones (proxy pools and product entitlements), IP allocations, access control, and billing
      programmatically. Endpoints include `POST/GET/DELETE /zone`, `/zone/change_disable`, `/zone/ips`
      (add/remove/refresh/migrate/statistics), `/zone/whitelist`, `/zone/blacklist`, `/zone/domain_perm`, plus
      `/customer/balance` and `/zone/bw` for balance and bandwidth reporting.
  - aid: bright-data:proxy-manager-api
    name: Bright Data Proxy Manager API
    tags:
      - Proxy Manager
      - Local API
      - Self-Hosted
    humanURL: https://docs.brightdata.com/proxy-networks/proxy-manager/api
    properties:
      - url: https://docs.brightdata.com/proxy-networks/proxy-manager/api
        type: Documentation
      - url: openapi/bright-data-proxy-manager-api-openapi.yml
        type: OpenAPI
    description: >-
      Local self-hosted REST control plane (port 22999) for the Bright Data Proxy Manager. Programmatically create and
      configure proxy ports (`/api/proxies`, `/api/proxies/{PORT}`), ban offending IPs (`/api/proxies/{PORT}/banip`),
      refresh IP pools (`/api/refresh_ips`), and read zone configuration (`/api/zones`). Supports SSL, logging,
      statistics, and remote upgrade/restart endpoints.
  - aid: bright-data:scraping-shield-api
    name: Bright Data Scraping Shield API
    tags:
      - Compliance
      - Domain Classification
      - Trust and Safety
    humanURL: https://docs.brightdata.com/api-reference/scraping-shield-api/Scraping-Shield-API-Overview
    properties:
      - url: https://docs.brightdata.com/api-reference/scraping-shield-api/Scraping-Shield-API-Overview
        type: Documentation
      - url: openapi/bright-data-scraping-shield-api-openapi.yml
        type: OpenAPI
    description: >-
      Compliance-focused classification API that exposes Bright Data's allowlist/blocklist taxonomy. `GET /shield/class`
      lists every classification, `/shield/domains_by_class` returns domains by category, `/shield/samples` returns
      sample classifications, and `/shield/zones_by_class` reports the zones cleared for each class.
  - aid: bright-data:mcp-server
    name: Bright Data MCP Server
    tags:
      - MCP
      - Model Context Protocol
      - AI Agents
      - Tools
    humanURL: https://docs.brightdata.com/mcp-server/overview
    properties:
      - url: https://docs.brightdata.com/mcp-server/overview
        type: Documentation
      - url: https://github.com/brightdata/brightdata-mcp
        type: SourceCode
    description: >-
      Bright Data's Model Context Protocol server exposes 60+ web-access tools (search, scrape, structured extraction,
      browser automation, datasets) to MCP-compatible clients including Claude Desktop, Claude Code, ChatGPT, Cursor,
      LangChain, LangGraph, LlamaIndex, CrewAI, n8n, Google ADK, NVIDIA NeMo, and Cloudflare Agents. Available as a
      hosted endpoint (5,000 free requests/month), self-hosted, and remote.
